<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#009977"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Calendar grid -->
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <rect x="20" y="18" width="60" height="64" rx="6" fill="url(#accent)" fill-opacity="0.15"/>
    <line x1="35" y1="30" x2="35" y2="74"/>
    <line x1="50" y1="30" x2="50" y2="74"/>
    <line x1="65" y1="30" x2="65" y2="74"/>
    <line x1="20" y1="42" x2="80" y2="42"/>
    <line x1="20" y1="56" x2="80" y2="56"/>
    <line x1="20" y1="70" x2="80" y2="70"/>
  </g>
  <!-- Current day indicator -->
  <circle cx="50" cy="49" r="8" fill="url(#accent)"/>
  <text x="50" y="53" text-anchor="middle" fill="#0d0d14" font-size="10" font-weight="bold" font-family="system-ui">СЕЙЧАС</text>
</svg>